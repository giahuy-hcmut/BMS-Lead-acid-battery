; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; EVERY dependency below is pinned to an exact version, on purpose.
;
; With `platform = espressif32` and caret ranges, a clean machine installs
; whatever is newest that day. That is how CI first failed: the bench had
; espressif32 6.11.0 while the runner installed 8.0.0, and between those two
; Espressif changed the ESP-NOW send callback from
;   void(const uint8_t *mac, esp_now_send_status_t)
; to
;   void(const wifi_tx_info_t *info, esp_now_send_status_t)
; so Task_EspNow.cpp no longer compiled - with no change to this repository.
;
; The versions below are the ones the firmware was MEASURED and FLASHED with,
; so CI now validates the same binary that was tested on the bench. Upgrading
; is a deliberate edit here, not something that happens by itself.

[env:esp32doit-devkit-v1]
platform = espressif32@6.11.0
board = esp32doit-devkit-v1
framework = arduino

; LiquidCrystal_I2C went out with Task_LCD; the master no longer drives an
; LCD. GPIO 21/22 (I2C) now belong to the INA219 current sensor, and the
; MCP2515 uses VSPI on 5/18/19/23.
lib_deps =
	mathieucarbou/AsyncTCP@3.3.2
	mathieucarbou/ESPAsyncWebServer@3.6.0
	coryjfowler/mcp_can@1.5.1
	adafruit/Adafruit INA219@1.2.3

monitor_speed = 115200
monitor_port = COM4
monitor_filters = log2file
