; Bench rig for the INA219 + external shunt current sensor.
;
; Standalone project ON PURPOSE. BMS_Master is a working closed-loop system
; (commit bb63a1a) and must not be disturbed by an unverified sensor. Everything
; here is throwaway EXCEPT two numbers it produces - CURRENT_ZERO_MV and
; CURRENT_SIGN - which get copied into BMS_Master/include/Config.h afterwards.

[env:esp32doit-devkit-v1]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200

lib_deps = adafruit/Adafruit INA219 @ ^1.2.3
